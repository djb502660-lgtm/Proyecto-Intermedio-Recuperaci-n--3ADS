<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Detalle del libro</h3>
            <div class="d-flex gap-2">
                <a href="libros.html" class="btn btn-outline-secondary btn-sm">Volver</a>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm" type="button">Cerrar sesión</button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body" id="detalle-libro">
                Cargando...
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { API_URL } from "../../js/config.js";
        import "../../js/logout.js";

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const cont = document.getElementById("detalle-libro");

        async function cargarLibro() {
            if (!id) {
                cont.textContent = "ID no especificado.";
                return;
            }
            try {
                const res = await fetch(`${API_URL}?action=obtener_libro&id_libro=${id}`);
                const data = await res.json();
                if (!data.success || !data.data) {
                    cont.textContent = data.message || "No se pudo obtener el libro.";
                    return;
                }
                const l = data.data;
                cont.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Título</label>
                            <div class="form-control-plaintext">${l.titulo}</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Autor</label>
                            <div class="form-control-plaintext">${l.autor}</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Año</label>
                            <div class="form-control-plaintext">${l.anio}</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Categoría</label>
                            <div class="form-control-plaintext">${l.categoria}</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Stock</label>
                            <div class="form-control-plaintext">${l.stock}</div>
                        </div>
                        <div class="col-12 mt-3">
                            <a class="btn btn-warning me-2" href="editar_libro.html?id=${l.id_libro}">Editar</a>
                            <a class="btn btn-outline-secondary" href="libros.html">Volver al listado</a>
                        </div>
                    </div>
                `;
            } catch (e) {
                cont.textContent = "Error al cargar el libro.";
            }
        }

        cargarLibro();
    </script>
</body>
</html>
