<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios - Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../home/index.html">Sistema de Biblioteca</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="../libros/libros.html">Libros</a></li>
                    <li class="nav-item"><a class="nav-link" href="../prestamos/prestamos.html">Préstamos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0">Registrar usuario</h5>
                            <div class="d-flex gap-2">
                                <a href="../home/index.html" class="btn btn-outline-secondary btn-sm">Home</a>
                                <button id="logout-btn" class="btn btn-outline-danger btn-sm" type="button">Cerrar sesión</button>
                            </div>
                        </div>
                        <form id="user-form" class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control" required />
                            </div>
                            <div class="col-12">
                                <label class="form-label">Correo</label>
                                <input type="email" name="correo" class="form-control" required />
                            </div>
                            <div class="col-12">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control" />
                            </div>
                            <div class="col-12">
                                <button class="btn btn-success w-100" type="submit">Guardar</button>
                            </div>
                            <div class="col-12">
                                <div class="alert d-none" id="user-msg"></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Listado de usuarios</h5>
                            <button class="btn btn-outline-primary btn-sm" id="reload-btn">Actualizar</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped" id="users-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Teléfono</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/logout.js"></script>
    <script type="module" src="../../js/usuarios.js"></script>
</body>
</html>
