<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-3">Registrar administrador</h4>
                        <form id="register-form" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo</label>
                                <input type="email" name="correo" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" required />
                            </div>
                            <div class="col-12">
                                <label class="form-label">Clave de administrador</label>
                                <input type="text" name="clave_admin" class="form-control" placeholder="biblioteca123" required />
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
                            </div>
                            <div class="col-12">
                                <div class="alert d-none" id="register-msg"></div>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a class="btn btn-outline-primary btn-sm" href="login.html">Ir a iniciar sesión</a>
                        </div>
                        <div class="text-center mt-2">
                            <a href="../home/index.html" class="text-muted">Volver al inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../../js/auth.js"></script>
</body>
</html>
